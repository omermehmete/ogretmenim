<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Öğretmenim</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Düzen: defter sayfası hissi. Kareli üst kart, tebeşir sarısı vurgu, video için yeşil okul tahtası. */
:root{
  --bg:#F1F4F8; --card:#FFFFFF; --ink:#13203A; --mute:#55637E; --line:#D7DFEA;
  --accent:#2457D6; --accent-ink:#FFFFFF; --soft:#E5ECFB; --grid:#E3EAF5; --mk:#FFE27A;
  --ok:#14804F; --okbg:#DCF3E7; --bad:#B93434; --badbg:#FBE0E0;
  --board:#163A31; --chalk:#F3F1E4; --frame:#3C4A57;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1523; --card:#172138; --ink:#E9EFFB; --mute:#9AA9C4; --line:#2A3757;
  --accent:#7FA5FF; --accent-ink:#0E1523; --soft:#1D2B50; --grid:#1F2B47; --mk:#6B5A12;
  --ok:#4CC38A; --okbg:#133A2B; --bad:#FF8585; --badbg:#4A1F26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1523; --card:#172138; --ink:#E9EFFB; --mute:#9AA9C4; --line:#2A3757;
  --accent:#7FA5FF; --accent-ink:#0E1523; --soft:#1D2B50; --grid:#1F2B47; --mk:#6B5A12;
  --ok:#4CC38A; --okbg:#133A2B; --bad:#FF8585; --badbg:#4A1F26; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);padding-inline:16px;padding-block:0 110px}
#app{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:16px;padding-top:12px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800} h2{font-size:22px;font-weight:800} h3{font-size:17px;font-weight:600}
p{margin:0}
.mark{background:linear-gradient(transparent 58%,var(--mk) 58%);padding-inline:2px}
.mute{color:var(--mute)} .small{font-size:13px}
.up{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--mute)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:5}
.brand{font:800 20px var(--f-display)}
.who{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 0;align-self:flex-start}
.page{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.paper{background-color:var(--card);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700}
.stat b{font-variant-numeric:tabular-nums;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--accent)}
.tile .n{font:800 12px var(--f-display);color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.tile.wide{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tile.wide .n{color:var(--accent-ink);opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 18px;font-weight:700;font-size:16px;min-height:46px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
input[type=text],input[type=password],select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;min-height:46px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.opt{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--okbg);border-color:var(--ok)} .opt.bad{background:var(--badbg);border-color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:10px}
.fb{border-radius:12px;padding:12px 14px;font-weight:600}
.fb.ok{background:var(--okbg);color:var(--ok)} .fb.bad{background:var(--badbg);color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s linear}
.qtext{font:600 20px/1.35 var(--f-display)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mc{min-height:84px;border:1.5px solid var(--line);border-radius:12px;background:var(--accent);color:var(--accent-ink);font:800 26px var(--f-display);padding:6px;display:flex;align-items:center;justify-content:center;text-align:center}
.mc.up2{background:var(--card);color:var(--ink);font:700 13px/1.25 var(--f-body)}
.mc.done{background:var(--okbg);color:var(--ok);border-color:var(--ok);font:700 13px/1.25 var(--f-body)}
.big{font:800 52px var(--f-display);font-variant-numeric:tabular-nums;text-align:center}
.calc{display:flex;gap:10px}
.calc input{font-size:22px;text-align:center}
.note{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.sym{font:800 22px var(--f-display);color:var(--accent)}
.dl{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.dl div{display:flex;flex-direction:column;gap:2px;padding:9px 0;border-top:1px solid var(--line)}
.dl dt,.dl b{font-weight:700} .dl span{color:var(--mute);font-size:14px}
.stage{background:var(--board);color:var(--chalk);border:6px solid var(--frame);border-radius:14px;min-height:300px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.stage .s{font:800 64px/1 var(--f-display);color:#FFE27A;animation:pop .45s ease-out}
.stage h3{font-size:24px;animation:rise .5s ease-out}
.stage p{font-size:17px;max-width:46ch;animation:rise .6s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.segs{display:flex;gap:4px}.segs i{flex:1;height:6px;border-radius:9px;background:var(--line)}.segs i.on{background:var(--accent)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.composer{position:sticky;bottom:0;background:var(--bg);padding-block:10px;display:flex;gap:8px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:13px 20px;font:800 16px var(--f-display);box-shadow:0 6px 18px rgba(20,40,100,.28);z-index:6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

let _sample;
async function getSample(){
  if(_sample !== undefined) return _sample;
  try{ _sample = (window.claude && window.claude.use) ? await window.claude.use("sample") : null; }catch(e){ _sample = null; }
  return _sample;
}
function aiErr(e){
  const c = e && e.code;
  if(c === "not_granted") return "Öğretmenim'i kullanmak için Claude erişimine izin vermen gerekiyor.";
  if(c === "rate_limited") return "Çok sık istek gönderildi. Biraz bekleyip tekrar dene.";
  if(c === "cancelled") return "";
  if(c === "invalid_json") return "Yanıt okunamadı. Tekrar dene.";
  if(c === "sampling_disabled" || c === "not_declared" || c === "capability_disabled") return "Öğretmenim bu hesapta kullanılamıyor.";
  return "Bağlantı sorunu oldu. Birkaç saniye sonra tekrar dene.";
}

  clearT();
  V = Object.assign({name:"quiz"}, {Q:Object.assign({title, items, i:0, score:0, streak:0, sel:null, wrong:[], t0:Date.now(), limit:20000}, o)});

function vQuiz(){
  const Q = V.Q;
  if(Q.i >= Q.items.length) return vResult();
  const it = Q.items[Q.i], ans = Q.sel != null;
  if(Q.timed && !ans){
    V.after = () => {
      const tk = setInterval(() => {
        const f = 1 - (Date.now() - Q.t0) / Q.limit, el = $("#tb");
        if(el) el.style.width = Math.max(0, f*100) + "%";
        if(f <= 0){ clearInterval(tk); pickAns(-1); }
      }, 100);
      timers.push(tk);
    };
  }
  let fb = "";
  if(ans){
    const ok = Q.sel === it.a;
    fb = `<div class="fb ${ok?"ok":"bad"}" role="status">${ok ? "Doğru!" : (Q.sel === -1 ? "Süre doldu." : "Yanlış.")} ${ok ? "" : "Doğru cevap: " + esc(it.o[it.a])}</div>
      <div class="row"><button class="btn" data-act="nextQ">${Q.i+1 === Q.items.length ? "Sonucu gör" : "Sonraki soru"}</button>
      ${ok ? "" : `<button class="btn ghost" data-act="explain">Öğretmenim anlatsın</button>`}</div>`;
  }
  return backBtn(Q.back, "Çık") + `<div class="page">
    <div class="row" style="justify-content:space-between"><span class="up">${esc(Q.title)}</span><span class="up">${Q.i+1} / ${Q.items.length}</span></div>
    <div class="bar" aria-hidden="true"><i style="width:${Q.i/Q.items.length*100}%"></i></div>
    ${Q.timed ? `<div class="bar" aria-label="Kalan süre"><i id="tb" style="width:${ans?0:100}%;transition:none"></i></div>` : ""}
    ${Q.ai ? '<p class="small mute">Bu sorular yapay zekâ ile üretildi.</p>' : ""}
    <p class="qtext">${esc(it.q)}</p>
    <div class="opts">${it.o.map((o,i) => `<button class="opt${ans ? (i===it.a?" ok":(i===Q.sel?" bad":"")) : ""}" data-act="pick" data-i="${i}" ${ans?"disabled":""}>${esc(o)}</button>`).join("")}</div>
    ${fb}</div>`;
}
function pickAns(i){
  const Q = V.Q; if(Q.sel != null) return;
  clearT(); Q.sel = i;
  const it = Q.items[Q.i];
  if(i === it.a){ Q.score++; Q.streak++; addXP(10 + (Q.timed && Q.streak > 1 ? 5 : 0)); }
  else { Q.streak = 0; Q.wrong.push(it); }
  P.solved++; saveP(); render();
}
function vResult(){
  const Q = V.Q, n = Q.items.length, r = Q.score / n;
  const key = Q.key;
  if(key && !Q.saved){ Q.saved = true; if((P.best[key] ?? -1) < Q.score){ P.best[key] = Q.score; saveP(); } }
  const msg = r === 1 ? "Mükemmel, hepsi doğru!" : r >= .7 ? "Çok iyi gidiyorsun." : r >= .4 ? "İyi bir başlangıç. Tekrar dene." : "Sorun değil, konu özetine bakıp yeniden dene.";
  return `<div class="page"><span class="up">${esc(Q.title)}</span>
    <div class="big">${Q.score} / ${n}</div><p style="text-align:center;font-weight:700">${msg}</p>

async function genQuestions(topic, n, label){
  const msg = $("#genMsg"), btn = $("#genBtn");
  const sample = await getSample();
  if(!sample){ msg.textContent = "Yapay zekâ bu görünümde kullanılamıyor."; return null; }
  btn.disabled = true; msg.textContent = "Öğretmenim sorular hazırlıyor...";
  try{
    const arr = await sample.json(`Türkiye Yüzyılı Maarif Modeli'ne uygun (beceri temelli, günlük hayatla bağlantılı), ${sinifTxt()} öğrencisi için ${topic} hakkında ${n} adet 4 şıklı çoktan seçmeli soru yaz. Sorular birbirinden farklı olsun, tek doğru cevabı olsun, doğru cevap hesaplanabilir ve kesin olsun. Yalnızca JSON dizisi döndür. Örnek biçim: [{"q":"2+3 kaçtır?","o":["4","5","6","7"],"a":1}] (a = doğru şıkkın 0 tabanlı sırası).`, {cache:false, modelTier:"default"});
    const ok = (Array.isArray(arr) ? arr : []).filter(x => x && typeof x.q === "string" && Array.isArray(x.o) && x.o.length === 4 && Number.isInteger(x.a) && x.a >= 0 && x.a < 4);
    if(!ok.length) throw {code:"invalid_json"};
    msg.textContent = ""; btn.disabled = false;
    return ok.map(x => prep([x.q, x.o.map(String), x.a]));
  }catch(e){ msg.textContent = aiErr(e); btn.disabled = false; return null; }
}

function allOf(k){ return dersList().flatMap(d => d[k]); }
function vMem(){
  const G = V.G;
  if(!G){
    const pairs = T.ders === "mix" ? shuffle(allOf("m")).slice(0,6) : dersList()[0].m.slice(0,6);
    V.G = {cards: shuffle(pairs.flatMap((p,i) => [{p:i, t:p[0]}, {p:i, t:p[1]}])), flip:[], done:[], moves:0, lock:false};
  }
  const g = V.G, fin = g.done.length === g.cards.length;
  if(fin && !g.paid){ g.paid = true; g.xp = Math.max(10, 40 - (g.moves-6)*3); addXP(g.xp); }
  return backBtn("oyun", "Oyunlar") + `<div class="page"><div class="row" style="justify-content:space-between"><span class="up">Eşleştir · ${esc(dersAd())}</span><span class="up">${g.moves} hamle</span></div>

    <div class="mgrid">${g.cards.map((c,i) => {
      const done = g.done.includes(i), up = g.flip.includes(i);
      return `<button class="mc ${done?"done":up?"up2":""}" data-act="flip" data-i="${i}" ${done?"disabled":""} aria-label="${done||up?esc(c.t):"Kapalı kart"}">${done||up?esc(c.t):"?"}</button>`;
    }).join("")}</div>
    ${fin ? `<div class="fb ok">Hepsini buldun! ${g.moves} hamle, +${g.xp} puan.</div><div class="row"><button class="btn" data-act="game" data-id="mem">Yeni oyun</button></div>` : ""}</div>`;
}
function flipCard(i){
  const g = V.G; if(g.lock || g.flip.includes(i) || g.done.includes(i)) return;
  g.flip.push(i);
  if(g.flip.length === 2){
    g.moves++;
    const [a,b] = g.flip;
    if(g.cards[a].p === g.cards[b].p){ g.done.push(a,b); g.flip = []; }
    else { g.lock = true; timers.push(setTimeout(() => { g.flip = []; g.lock = false; if(V.name === "mem") render(); }, 900)); }
  }
  render();
}

function genCalc(){
  const k = U.kademe, t = rnd(0,3);
  if(k === "ilk"){
    if(t < 2){ const a = rnd(5,30), b = rnd(3,20); return [`${a} + ${b}`, a+b]; }
    if(t === 2){ const a = rnd(10,40), b = rnd(1,a); return [`${a} − ${b}`, a-b]; }
    const a = rnd(2,9), b = rnd(2,9); return [`${a} × ${b}`, a*b];
  }
  if(k === "orta"){
    if(t === 0){ const a = rnd(6,15), b = rnd(6,15); return [`${a} × ${b}`, a*b]; }
    if(t === 1){ const b = rnd(2,9), q = rnd(2,12); return [`${b*q} ÷ ${b}`, q]; }
    if(t === 2){ const p = pick1([10,20,25,50]), n = pick1([40,60,80,100,200]); return [`${n} sayısının %${p}'i`, n*p/100]; }
    const a = rnd(2,15); return [`${a}²`, a*a];
  }
  if(k === "lise"){
    if(t === 0){ const x = rnd(1,6); return [`x = ${x} için 2x² + 3`, 2*x*x+3]; }
    if(t === 1){ const x = rnd(1,9), b = rnd(1,9); return [`2x + ${b} = ${2*x+b} ise x`, x]; }
    if(t === 2){ const e = rnd(1,7); return [`log₂ ${2**e}`, e]; }
    const a = rnd(2,15); return [`√${a*a}`, a];
  }
  if(t === 0){ const n = rnd(5,31); return [`(${n.toString(2)})₂ onluk tabanda`, n]; }
  if(t === 1){ const a = rnd(1,5), k2 = rnd(1,5); return [`f(x) = ${a}x² için f′(${k2})`, 2*a*k2]; }
  if(t === 2){ const a = rnd(10,99), b = rnd(3,9); return [`${a} mod ${b}`, a % b]; }
  const n = rnd(4,12); return [`1 + 2 + … + ${n}`, n*(n+1)/2];
}

function resizeImg(file, cb){

async function genLong(d, i){
  const p = d.p[i], sample = await getSample();
  if(!sample){ alert("Yapay zekâ bu görünümde kullanılamıyor."); return false; }
  V.busy = i; render();
  try{
    const arr = await sample.json(`${sinifTxt()} öğrencisi için "${d.ad} dersi: ${p[0]}" konusunu (kısa özet: ${p[1]}) Türkiye Yüzyılı Maarif Modeli'ne uygun, ayrıntılı ve uzun anlat; toplam 400-500 kelime olsun. Bilgi kesin ve doğru olsun. 6 bölüm yaz: Merak uyandıran giriş; Temel kavramlar; Ayrıntılı anlatım; Adım adım çözümlü örnek veya örnek olay; Günlük hayattan bağlantı; Değer ve beceri bağlantısı ile kısa özet. Her bölüm 60-90 kelime olsun. Yalnızca JSON dizisi döndür: [{"b":"bölüm başlığı","m":"anlatım","e":"bölümü anlatan 1-3 emoji"}]. Markdown kullanma.`, {cache:false, modelTier:"default"});
    const ok = (Array.isArray(arr) ? arr : []).filter(x => x && typeof x.b === "string" && typeof x.m === "string");
    if(!ok.length) throw {code:"invalid_json"};
    store.set(lkey(d,p), ok.slice(0,8).map(x => ({b:x.b.slice(0,70), m:x.m.slice(0,1000), e:String(x.e || "").slice(0,12)})));
    return true;
  }catch(e){ alert(aiErr(e) || "Bir sorun oldu."); return false; }
  finally{ V.busy = null; if(V.name === "mat") render(); }
}

function aiScenes(v){
  const a = [{baslik:v.konu, metin:`${v.sinif} için uzun video ders. ${v.plan.length} bölüm var; her iki bölümden sonra kısa bir oyun seni bekliyor. Hazırsan başlıyoruz.`, sembol:"▶"}];
  const qs = (v.sorular || []).slice();
  v.bolum.forEach((b, i) => {
    a.push({baslik:b.b, metin:b.m, sembol:b.e || "•", ai:1});
    if(i % 2 === 1 && qs.length){ const q = qs.shift(); a.push(gMC([q.q, q.o, q.a])); }
  });
  if(v.tamam){
    qs.slice(0, 2).forEach(q => a.push(gMC([q.q, q.o, q.a])));
    const end = {baslik:"Özet", metin:(v.ozet || "Dersi bitirdik.") + " Takıldığın yeri Öğretmenim'e sorabilirsin.", sembol:"✓"}; end.sum = 1; a.push(end);
  } else a.push({baslik:"Devamı hazırlanıyor", metin:"Öğretmenim sonraki bölümleri yazıyor. Birazdan video kendiliğinden devam edecek.", sembol:"⏳", wait:1});
  return a;
}

  const prog = busy ? `<div class="bar" aria-hidden="true"><i style="width:${Math.round(100 * GEN.done / Math.max(1, GEN.total))}%"></i></div><p class="small" id="aiMsg" role="status">${esc(GEN.msg)}</p>` : `<p class="small mute" id="aiMsg" role="status"></p>`;
  const form = `<form class="page" id="vidForm"><h3>Yapay zekâ ile uzun video ders yap</h3>
    <p class="small mute">Konuyu yaz, Öğretmenim ${esc(sinifTxt())} seviyesine göre bölüm bölüm anlatan, arada oyunları olan uzun bir video hazırlasın. İlk bölümler hazır olunca izlemeye başlayabilirsin.</p>
    <div class="field"><label for="vtopic">Konu</label><input type="text" id="vtopic" placeholder="Örn. Osmanlı Devleti'nin kuruluşu, Fotosentez, Üslü sayılar" maxlength="100" ${busy ? "disabled" : ""}></div>
    <div class="field"><label for="vlen">Uzunluk</label><select id="vlen" ${busy ? "disabled" : ""}>${Object.entries(UZ).map(([k, x]) => `<option value="${k}" ${k === (store.get("vlen", "uzun")) ? "selected" : ""}>${x.ad}</option>`).join("")}</select></div>
    <button class="btn" type="submit" id="vidBtn" ${busy ? "disabled" : ""}>${busy ? "Hazırlanıyor..." : "Uzun videoyu hazırla"}</button>${prog}</form>`;
  h = h.replace(/<form class="page" id="vidForm">[\s\S]*?<\/form>/, form);
  return h.replace('<div class="stage"', mine + '<div class="stage"');
};

async function genSections(v, sample){
  const per = 3;
  while(v.bolum.length < v.plan.length){
    const from = v.bolum.length, part = v.plan.slice(from, from + per);
    GEN.msg = `Bölüm ${from + 1}–${from + part.length} / ${v.plan.length} yazılıyor...`; aiRefresh();
    const prev = v.bolum.slice(-1).map(x => x.b + ": " + x.m.slice(0, 200)).join("");
    const arr = await sample.json(`${v.sinif} öğrencisi için "${v.konu}" konulu uzun bir video dersin anlatım metnini yazıyorsun. Türkiye Yüzyılı Maarif Modeli'ne uygun, konuşma diliyle, sıcak bir öğretmen sesiyle yaz. Bilgiler kesin ve doğru olsun; emin olmadığın tarih, sayı veya isim yazma.
Dersin bölüm planı:
${v.plan.map((p, i) => `${i + 1}. ${p.b} — ${p.ozet}`).join("\n")}
${prev ? "Bir önceki bölüm şöyle bitti: " + prev + "\n" : ""}Şimdi yalnızca şu bölümleri yaz: ${part.map((p, i) => (from + i + 1) + ". " + p.b).join("; ")}.
Her bölüm 70-100 kelime olsun, önceki bölümleri tekrar etme, uygun yerde somut örnek ver. Yalnızca JSON dizisi döndür: [{"b":"bölüm başlığı","m":"anlatım metni","e":"bölümü anlatan 1-3 emoji"}]. Markdown kullanma.`, {cache:false, modelTier:"default"});
    const ok = (Array.isArray(arr) ? arr : []).filter(x => x && typeof x.b === "string" && typeof x.m === "string").slice(0, part.length);
    if(!ok.length) throw {code:"invalid_json"};
    ok.forEach(x => v.bolum.push({b:x.b.slice(0, 70), m:x.m.slice(0, 900), e:String(x.e || "").slice(0, 12)}));
    GEN.done = v.bolum.length + 1;
    aiSave(v); aiRefresh(true);
  }
  v.tamam = true; aiSave(v);
}
function aiSave(v){ const a = aiVids().filter(x => x.id !== v.id); a.unshift(v); saveAiVids(a); }
function aiRefresh(scenes){
  if(V.name !== "video") return;
  const v = GEN && aiVid(GEN.id);
  if(scenes && v && V.vk === "ai:" + v.id && V.scenes){
    const keep = V.scenes, fresh = aiScenes(v);
    // oynatma ve verilen cevaplar korunur; yalnızca yeni sahneler eklenir
    V.scenes = keep.filter(s => !s.wait).concat(fresh.slice(keep.filter(s => !s.wait).length));
    const waiting = keep[V.i] && keep[V.i].wait;
    if(waiting && V.scenes[V.i] && !V.scenes[V.i].wait && V.playing){ drawScene(); playScene(); }
  }
  const pos = window.scrollY; render(); window.scrollTo(0, pos);
}
async function runGen(v, sample){
  GEN = {id:v.id, konu:v.konu, total:v.plan.length + 1, done:v.bolum.length + 1, msg:"Hazırlanıyor..."};
  try{
    await genSections(v, sample);
    GEN = null; aiRefresh(true);
    const m = $("#aiMsg"); if(m) m.textContent = "Video tamamlandı. " + durTxt(aiScenes(v)) + ".";
  }catch(e){
    GEN = null; aiRefresh(true);
    const m = $("#aiMsg"); if(m) m.textContent = (aiErr(e) || "Durduruldu.") + " Hazırlanan bölümler kaydedildi; 'Kalan bölümleri hazırla' ile devam edebilirsin.";
  }
}

doVid = async function(){
  if(GEN) return;
  const topic = ($("#vtopic").value || "").trim(), len = $("#vlen").value, n = (UZ[len] || UZ.uzun).n;
  const msg = $("#aiMsg");
  if(!topic){ msg.textContent = "Önce bir konu yaz."; $("#vtopic").focus(); return; }
  store.set("vlen", len);
  const sample = await getSample();
  if(!sample){ msg.textContent = "Yapay zekâ bu görünümde kullanılamıyor."; return; }
  GEN = {id:"", konu:topic, total:n + 1, done:0, msg:"Öğretmenim dersin planını çıkarıyor..."}; aiRefresh();
  try{
    const r = await sample.json(`${sinifTxt()} öğrencisi için "${topic}" konusunda ${n} bölümlük uzun bir video ders planla. Türkiye Yüzyılı Maarif Modeli'ne uygun olsun: merak uyandıran girişle başla, temel kavramlardan ayrıntıya ilerle, çözümlü örnekler ve günlük hayat bağlantısı kur, değer ve beceri bağlantısı ile bitir. Konu bu seviyeye uygun değilse seviyeye uygun yönünü anlat. Bilgiler kesin ve doğru olsun.
Ayrıca videonun içinde oynanacak ${Math.ceil(n / 2) + 2} adet 4 şıklı soru yaz; sorular anlatılan bölümlere dayansın.
Yalnızca JSON nesnesi döndür: {"baslik":"videonun kısa başlığı","bolumler":[{"b":"bölüm başlığı","ozet":"bu bölümde anlatılacakların tek cümlelik özeti"}],"sorular":[{"q":"soru","o":["A","B","C","D"],"a":0}],"ozet":"dersin 2-3 cümlelik özeti"}. "a" doğru şıkkın 0'dan başlayan sırasıdır. Markdown kullanma.`, {cache:false, modelTier:"default"});
    const plan = (r && Array.isArray(r.bolumler) ? r.bolumler : []).filter(x => x && typeof x.b === "string").slice(0, n).map(x => ({b:x.b.slice(0, 70), ozet:String(x.ozet || "").slice(0, 200)}));
    if(plan.length < 2) throw {code:"invalid_json"};
    const sorular = (Array.isArray(r.sorular) ? r.sorular : []).filter(q => q && typeof q.q === "string" && Array.isArray(q.o) && q.o.length >= 2 && Number.isInteger(q.a) && q.a >= 0 && q.a < q.o.length).map(q => ({q:q.q.slice(0, 220), o:q.o.slice(0, 4).map(o => String(o).slice(0, 90)), a:q.a})).filter(q => q.a < q.o.length);
    const v = {id:Date.now().toString(36), konu:String(r.baslik || topic).slice(0, 80) || topic, sinif:sinifTxt(), plan, bolum:[], sorular, ozet:String(r.ozet || "").slice(0, 400), tamam:false};
    aiSave(v);
    if(V.name === "video"){ clearT(); V.vk = "ai:" + v.id; V.scenes = null; V.i = 0; V.playing = false; V.ended = false; }
    await runGen(v, sample);
  }catch(e){
    GEN = null; aiRefresh();
    const m = $("#aiMsg"); if(m) m.textContent = aiErr(e) || "Durduruldu.";
  }
};
ACT.aidevam = async () => {
  if(GEN || !V.vk || !V.vk.startsWith("ai:")) return;
  const v = aiVid(V.vk.slice(3)), sample = await getSample();
  if(!v) return; if(!sample){ const m = $("#aiMsg"); if(m) m.textContent = "Yapay zekâ bu görünümde kullanılamıyor."; return; }
  await runGen(v, sample);
};
ACT.aisil = () => {
  if(!V.vk || !V.vk.startsWith("ai:")) return;
  const id = V.vk.slice(3); if(GEN && GEN.id === id) return;
  saveAiVids(aiVids().filter(x => x.id !== id));
  clearT(); V.vk = "full"; V.scenes = null; V.i = 0; V.playing = false; V.ended = false; render();
};
const _dersAI = ACT.ders;
ACT.ders = d => { if(V.name === "video" && V.vk && V.vk.startsWith("ai:")) V.vk = "full"; _dersAI(d); };

// Uzun metinler: sesi cümle cümle oku (tarayıcılar uzun konuşmaları yarıda kesebiliyor); hazırlanan bölümü bekle.
playScene = function(){
  clearT();
  const s = V.scenes[V.i], g = s.game, txt = s.baslik + ". " + s.metin;
  if(s.wait){ timers.push(setTimeout(() => { if(V.playing && V.scenes[V.i] && V.scenes[V.i].wait && !GEN){ V.playing = false; drawScene(); } }, 4000)); return; }
  if(V.voice && "speechSynthesis" in window && s.pick == null){
    try{ (txt.match(/[^.!?…]+[.!?…]*/g) || [txt]).map(x => x.trim()).filter(Boolean).forEach(p => { const u = new SpeechSynthesisUtterance(p); u.lang = "tr-TR"; u.rate = 1.02; speechSynthesis.speak(u); }); }catch(e){}
  }
  if(g && s.pick == null) return;
  timers.push(setTimeout(() => {
    if(V.i < V.scenes.length-1){ V.i++; drawScene(); playScene(); }
    else { V.playing = false; V.ended = true; drawScene(); }
  }, g ? 2500 : txt.length*80 + 3500));
};
const _drawAI = drawScene;
drawScene = function(){
  _drawAI();
  const st = $("#stage"), s = V.scenes && V.scenes[V.i]; if(!st || !s) return;
  const p = st.querySelector("p"); if(p && s.metin.length > 320){ p.style.fontSize = "15px"; p.style.textAlign = "left"; }
  const sg = $("#segs"); if(sg) sg.style.gap = V.scenes.length > 24 ? "2px" : "";
  const c = $("#vcount"); if(c) c.textContent = `Sahne ${V.i + 1} / ${V.scenes.length}`;
};
const _vVideoAI2 = vVideo;
vVideo = () => _vVideoAI2().replace('<div class="segs" id="segs" aria-hidden="true"></div>', '<div class="segs" id="segs" aria-hidden="true"></div><p class="small mute" id="vcount" style="text-align:center"></p>');


if(U) draft = {kad:U.kademe, sinif:U.sinif, ad:U.ad || "", okul:U.okul};
render();
</script>
